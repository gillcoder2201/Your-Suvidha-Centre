<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Print Studio - Your Suvidha Centre</title>
    <!-- jsPDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- pdf.js for rendering uploaded PDF cards -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #ffffff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }
        .logo-container svg {
            width: 35px;
            height: 35px;
            fill: #2c3e50;
        }
        h1 {
            font-size: 22px;
            color: #2c3e50;
        }
        .powered-by {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            border: 1px solid #e9ecef;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }
        select, input[type="file"], input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        select:focus, input:focus {
            border-color: #4CAF50;
        }
        .hidden {
            display: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <svg viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/>
            </svg>
            <h1>Your Suvidha Centre</h1>
        </div>
        <div class="powered-by">POWERED BY GILL TECH SOLUTIONS</div>
    </header>

    <main>
        <div class="container">
            <h2>Card Print Studio</h2>
            
            <div class="form-group">
                <label for="cardType">Select Card Type:</label>
                <select id="cardType" onchange="handleCardSelection()">
                    <option value="aadhaar">Aadhaar Card (Supports Locked/Protected PDF)</option>
                    <option value="ayushman">Ayushman Card</option>
                    <option value="eshram">e-Shram Card</option>
                </select>
            </div>

            <div class="form-group">
                <label for="outputName">Printable File Name:</label>
                <input type="text" id="outputName" value="Printable_Card">
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="pdfPassword">PDF Password (If Locked):</label>
                <input type="password" id="pdfPassword" placeholder="Enter 8-digit password">
            </div>

            <div class="form-group">
                <label for="cardFile">Upload Card File (PDF or Image):</label>
                <input type="file" id="cardFile" accept="application/pdf,image/*">
            </div>

            <button onclick="generatePrintLayout()">Generate Printable PDF</button>
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Your Suvidha Centre. All rights reserved.</p>
        <p>Powered by <strong>Gill Tech Solutions</strong></p>
    </footer>

<script>
    function handleCardSelection() {
        const cardType = document.getElementById('cardType').value;
        const passwordGroup = document.getElementById('passwordGroup');
        if (cardType === 'aadhaar') {
            passwordGroup.classList.remove('hidden');
        } else {
            passwordGroup.classList.add('hidden');
        }
    }

    async function generatePrintLayout() {
        const fileInput = document.getElementById('cardFile');
        const password = document.getElementById('pdfPassword').value;
        const cardType = document.getElementById('cardType').value;
        let outputName = document.getElementById('outputName').value.trim() || "Printable_Card";
        outputName = outputName.replace(/\s+/g, '_');

        if (fileInput.files.length === 0) {
            alert("Kripya pehle card ki file upload karein!");
            return;
        }

        const file = fileInput.files[0];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        try {
            if (file.type === 'application/pdf') {
                const arrayBuffer = await file.arrayBuffer();
                let pdfDoc;
                try {
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer, password: password });
                    pdfDoc = await loadingTask.promise;
                } catch (err) {
                    alert("PDF password galat ho sakta hai ya file locked hai.");
                    return;
                }

                async function getCardImage(pageNumber) {
                    const page = await pdfDoc.getPage(pageNumber);
                    const viewport = page.getViewport({ scale: 3.0 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const cropCanvas = document.createElement('canvas');
                    const cropCtx = cropCanvas.getContext('2d');
                    
                    let cropWidth, cropHeight, startX, startY;

                    if (cardType === 'aadhaar') {
                        // Official e-Aadhaar PDF ke liye exact middle/lower section jahan actual card hota hai
                        cropWidth = canvas.width * 0.72;
                        cropHeight = canvas.height * 0.32;
                        startX = (canvas.width - cropWidth) / 2;
                        startY = canvas.height * 0.38; // Adjusted down to capture the actual card box
                    } else {
                        // Baaki cards ke liye standard crop
                        cropWidth = canvas.width * 0.80;
                        cropHeight = canvas.height * 0.40;
                        startX = (canvas.width - cropWidth) / 2;
                        startY = canvas.height * 0.10;
                    }

                    cropCanvas.width = cropWidth;
                    cropCanvas.height = cropHeight;

                    cropCtx.drawImage(canvas, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                    return cropCanvas.toDataURL('image/jpeg', 1.0);
                }

                const cardWidth = 85.6;
                const cardHeight = 54;
                const X_Position = (210 - cardWidth) / 2; // Centered horizontally

                // Front Side - A4 page ke lower-middle area mein
                const imgData1 = await getCardImage(1);
                doc.addImage(imgData1, 'JPEG', X_Position, 160, cardWidth, cardHeight);

                // Back Side - A4 page ke bilkul bottom par
                if (pdfDoc.numPages > 1) {
                    const imgData2 = await getCardImage(2);
                    doc.addImage(imgData2, 'JPEG', X_Position, 220, cardWidth, cardHeight);
                }

            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const cardWidth = 85.6;
                    const cardHeight = 54;
                    const X_Position = (210 - cardWidth) / 2;
                    doc.addImage(e.target.result, 'JPEG', X_Position, 220, cardWidth, cardHeight);
                    doc.save(`${outputName}.pdf`);
                };
                reader.readAsDataURL(file);
                return;
            }

            doc.save(`${outputName}.pdf`);

        } catch (error) {
            console.error("Error:", error);
            alert("Layout generate karne mein samasya aayi.");
        }
    }
</script>

</body>
</html>
