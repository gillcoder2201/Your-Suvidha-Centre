<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Print Studio - Your Suvidha Centre</title>
    <!-- jsPDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- pdf.js for rendering uploaded PDF cards -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #ffffff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }
        .logo-container svg {
            width: 35px;
            height: 35px;
            fill: #2c3e50;
        }
        h1 {
            font-size: 22px;
            color: #2c3e50;
        }
        .powered-by {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 550px;
            width: 100%;
            border: 1px solid #e9ecef;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }
        select, input[type="file"], input[type="text"], input[type="password"], input[type="range"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        select:focus, input:focus {
            border-color: #4CAF50;
        }
        .hidden {
            display: none;
        }
        .preview-section {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .preview-section img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 8px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <svg viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/>
            </svg>
            <h1>Your Suvidha Centre</h1>
        </div>
        <div class="powered-by">POWERED BY GILL TECH SOLUTIONS</div>
    </header>

    <main>
        <div class="container">
            <h2>Card Print Studio</h2>
            
            <div class="form-group">
                <label for="cardType">Select Card Type:</label>
                <select id="cardType" onchange="handleCardSelection()">
                    <option value="aadhaar">Aadhaar Card (Supports Locked/Protected PDF)</option>
                    <option value="ayushman">Ayushman Card</option>
                    <option value="eshram">e-Shram Card</option>
                </select>
            </div>

            <div class="form-group">
                <label for="outputName">Printable File Name:</label>
                <input type="text" id="outputName" value="Printable_Card">
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="pdfPassword">PDF Password (If Locked):</label>
                <input type="password" id="pdfPassword" placeholder="Enter 8-digit password">
            </div>

            <div class="form-group">
                <label for="cardFile">Upload Card File (PDF or Image):</label>
                <input type="file" id="cardFile" accept="application/pdf,image/*" onchange="processFileForPreview()">
            </div>

            <!-- Manual Position Adjustment Slider -->
            <div class="form-group" id="sliderGroup" style="display:none;">
                <label for="verticalOffset">Vertical Crop Position Adjustment:</label>
                <input type="range" id="verticalOffset" min="0" max="600" value="220" oninput="updatePreviewImage()">
                <small style="color: #6c757d;">Card ko sahi jagah crop karne ke liye slider ko upar-neeche karein.</small>
            </div>

            <!-- Live Preview Box -->
            <div class="preview-section" id="previewBox" style="display:none;">
                <label><b>Live Front Card Preview:</b></label>
                <img id="previewImg" alt="Card Preview">
            </div>

            <button onclick="generatePrintLayout()">Generate & Download Printable PDF</button>
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Your Suvidha Centre. All rights reserved.</p>
        <p>Powered by <strong>Gill Tech Solutions</strong></p>
    </footer>

<script>
    let loadedPdfDoc = null;
    let originalCanvas = null;

    function handleCardSelection() {
        const cardType = document.getElementById('cardType').value;
        const passwordGroup = document.getElementById('passwordGroup');
        if (cardType === 'aadhaar') {
            passwordGroup.classList.remove('hidden');
        } else {
            passwordGroup.classList.add('hidden');
        }
    }

    async function processFileForPreview() {
        const fileInput = document.getElementById('cardFile');
        const password = document.getElementById('pdfPassword').value;
        const previewBox = document.getElementById('previewBox');
        const sliderGroup = document.getElementById('sliderGroup');

        if (fileInput.files.length === 0) return;
        const file = fileInput.files[0];

        try {
            if (file.type === 'application/pdf') {
                const arrayBuffer = await file.arrayBuffer();
                try {
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer, password: password });
                    loadedPdfDoc = await loadingTask.promise;
                } catch (err) {
                    alert("PDF password galat ho sakta hai ya file locked hai.");
                    return;
                }

                const page = await loadedPdfDoc.getPage(1);
                const viewport = page.getViewport({ scale: 2.0 });
                originalCanvas = document.createElement('canvas');
                const ctx = originalCanvas.getContext('2d');
                originalCanvas.height = viewport.height;
                originalCanvas.width = viewport.width;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                sliderGroup.style.display = 'block';
                previewBox.style.display = 'block';
                updatePreviewImage();
            } else {
                // Agar direct image upload ki ho
                sliderGroup.style.display = 'none';
                previewBox.style.display = 'block';
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        } catch (error) {
            console.error("Preview error:", error);
            alert("File load karne mein samasya aayi.");
        }
    }

    function updatePreviewImage() {
        if (!originalCanvas) return;
        const cardType = document.getElementById('cardType').value;
        const sliderVal = parseInt(document.getElementById('verticalOffset').value);

        const cropCanvas = document.createElement('canvas');
        const cropCtx = cropCanvas.getContext('2d');

        const halfWidth = originalCanvas.width / 2;
        let cropWidth, cropHeight, startX, startY;

        if (cardType === 'aadhaar') {
            cropWidth = halfWidth * 0.90;
            cropHeight = originalCanvas.height * 0.32;
            startX = halfWidth * 0.05;
            startY = sliderVal; // Slider value controls vertical crop position
        } else {
            cropWidth = originalCanvas.width * 0.85;
            cropHeight = originalCanvas.height * 0.38;
            startX = (originalCanvas.width - cropWidth) / 2;
            startY = sliderVal;
        }

        cropCanvas.width = cropWidth;
        cropCanvas.height = cropHeight;
        cropCtx.drawImage(originalCanvas, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

        document.getElementById('previewImg').src = cropCanvas.toDataURL('image/jpeg', 1.0);
    }

    async function generatePrintLayout() {
        const fileInput = document.getElementById('cardFile');
        const cardType = document.getElementById('cardType').value;
        const sliderVal = parseInt(document.getElementById('verticalOffset').value);
        let outputName = document.getElementById('outputName').value.trim() || "Printable_Card";
        outputName = outputName.replace(/\s+/g, '_');

        if (fileInput.files.length === 0) {
            alert("Kripya pehle card ki file upload karein!");
            return;
        }

        const file = fileInput.files[0];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        try {
            const cardWidth = 85.6; // Standard PVC card width in mm
            const cardHeight = 54;  // Standard PVC card height in mm
            const X_Position = (210 - cardWidth) / 2; // Horizontally centered

            if (file.type === 'application/pdf' && loadedPdfDoc) {
                
                function getCroppedDataURL(canvasSource, isBack = false) {
                    const cropCanvas = document.createElement('canvas');
                    const cropCtx = cropCanvas.getContext('2d');
                    const halfWidth = canvasSource.width / 2;
                    let cropWidth, cropHeight, startX, startY;

                    if (cardType === 'aadhaar') {
                        cropWidth = halfWidth * 0.90;
                        cropHeight = canvasSource.height * 0.32;
                        startX = isBack ? halfWidth + (halfWidth * 0.05) : halfWidth * 0.05;
                        startY = sliderVal;
                    } else {
                        cropWidth = canvasSource.width * 0.85;
                        cropHeight = canvasSource.height * 0.38;
                        startX = (canvasSource.width - cropWidth) / 2;
                        startY = sliderVal;
                    }

                    cropCanvas.width = cropWidth;
                    cropCanvas.height = cropHeight;
                    cropCtx.drawImage(canvasSource, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                    return cropCanvas.toDataURL('image/jpeg', 1.0);
                }

                // Front Side (A4 page ke lower-middle mein)
                const imgData1 = getCroppedDataURL(originalCanvas, false);
                doc.addImage(imgData1, 'JPEG', X_Position, 140, cardWidth, cardHeight);

                // Back Side (A4 page ke bilkul bottom par)
                if (cardType === 'aadhaar') {
                    const imgData2 = getCroppedDataURL(originalCanvas, true);
                    doc.addImage(imgData2, 'JPEG', X_Position, 205, cardWidth, cardHeight);
                } else if (loadedPdfDoc.numPages > 1) {
                    const page2 = await loadedPdfDoc.getPage(2);
                    const viewport2 = page2.getViewport({ scale: 2.0 });
                    const canvas2 = document.createElement('canvas');
                    await page2.render({ canvasContext: canvas2.getContext('2d'), viewport: viewport2 }).promise;
                    const imgData2 = getCroppedDataURL(canvas2, false);
                    doc.addImage(imgData2, 'JPEG', X_Position, 205, cardWidth, cardHeight);
                }

            } else {
                // Image file handling
                const reader = new FileReader();
                reader.onload = function(e) {
                    doc.addImage(e.target.result, 'JPEG', X_Position, 205, cardWidth, cardHeight);
                    doc.save(`${outputName}.pdf`);
                };
                reader.readAsDataURL(file);
                return;
            }

            doc.save(`${outputName}.pdf`);

        } catch (error) {
            console.error("Error:", error);
            alert("Printable layout generate karne mein samasya aayi.");
        }
    }
</script>

</body>
</html>
