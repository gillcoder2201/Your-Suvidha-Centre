<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhaar A4 PDF Generator - Your Suvidha Centre</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #ffffff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }
        .logo-container svg {
            width: 35px;
            height: 35px;
            fill: #2c3e50;
        }
        h1 {
            font-size: 22px;
            color: #2c3e50;
        }
        .powered-by {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            border: 1px solid #e9ecef;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="file"]:focus, input[type="text"]:focus {
            border-color: #4CAF50;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
        footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- Professional Header -->
    <header>
        <div class="logo-container">
            <svg viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/>
            </svg>
            <h1>Your Suvidha Centre</h1>
        </div>
        <div class="powered-by">POWERED BY GILL TECH SOLUTIONS</div>
    </header>

    <!-- Main Form Section -->
    <main>
        <div class="container">
            <h2>Aadhaar A4 PDF Generator</h2>
            
            <div class="form-group">
                <label for="pdfName">PDF File Name:</label>
                <input type="text" id="pdfName" value="Aadhaar_Document">
            </div>

            <div class="form-group">
                <label for="frontImage">Aadhaar Front Image:</label>
                <input type="file" id="frontImage" accept="image/*">
            </div>

            <div class="form-group hidden" id="signGroup">
                <label for="signImage">Signature Image:</label>
                <input type="file" id="signImage" accept="image/*">
            </div>

            <div class="form-group">
                <label for="backImage">Aadhaar Back Image:</label>
                <input type="file" id="backImage" accept="image/*">
            </div>

            <button onclick="generatePDF()">Generate & Download PDF</button>
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer>
        <p>&copy; 2026 Your Suvidha Centre. All rights reserved.</p>
        <p>Powered by <strong>Gill Tech Solutions</strong></p>
    </footer>

<script>
    window.onload = function() {
        let wantSign = confirm("Do you want to add a Signature to the PDF?");
        if (wantSign) {
            document.getElementById('signGroup').classList.remove('hidden');
        }
    };

    async function generatePDF() {
        const frontInput = document.getElementById('frontImage').files[0];
        const backInput = document.getElementById('backImage').files[0];
        const signGroup = document.getElementById('signGroup');
        const signInput = document.getElementById('signImage').files[0];
        let customName = document.getElementById('pdfName').value.trim() || "Aadhaar_Document";
        customName = customName.replace(/\s+/g, '_');

        if (!frontInput || !backInput) {
            alert("Please select at least the Aadhaar Front and Back images!");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        const readImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsDataURL(file);
            });
        };

        try {
            const frontData = await readImage(frontInput);
            doc.addImage(frontData, 'JPEG', 55, 20, 100, 63);

            if (!signGroup.classList.contains('hidden') && signInput) {
                const signData = await readImage(signInput);
                doc.addImage(signData, 'JPEG', 85, 95, 40, 20);
            }

            const backData = await readImage(backInput);
            let backYCoord = (!signGroup.classList.contains('hidden') && signInput) ? 130 : 100;
            doc.addImage(backData, 'JPEG', 55, backYCoord, 100, 63);

            doc.save(`${customName}.pdf`);
        } catch (error) {
            alert("An error occurred while generating the PDF.");
        }
    }
</script>

</body>
</html>
